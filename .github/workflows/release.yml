name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PHP syntax
        run: php -l functions.php

      - name: Check the version matches the tag
        run: |
          version="$(sed -n 's/^Version: *//p' style.css | tr -d '\r')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::style.css says $version, tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Read release notes from the changelog
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            index($0, "## " v " ") == 1 { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build the zip
        run: bin/build-zip.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/delta-child.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
